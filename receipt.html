<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EATHER Receipt</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--g:#666;--l:#E5E5E5;--s:#F7F7F7}
*{box-sizing:border-box;margin:0}
body{font:400 13px/1.55 Archivo,Arial,sans-serif;background:#F4F4F4;color:var(--ink);padding:40px 16px;-webkit-font-smoothing:antialiased}
.bar{max-width:600px;margin:0 auto 16px;display:flex;justify-content:flex-end;gap:10px}
.pb{background:none;border:1px solid #CFCFCF;padding:0 18px;min-height:40px;font:500 11px Archivo,Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;color:#000;transition:border-color .2s,background .2s,color .2s}
.pb:hover{border-color:#000}
.pb.d{background:#000;color:#fff;border-color:#000}.pb.d:hover{background:#fff;color:#000}
.r{max-width:600px;margin:0 auto;background:#fff;padding:56px 52px 40px;box-shadow:0 30px 60px -30px rgba(0,0,0,.18);animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:28px;border-bottom:1px solid var(--l)}
.logo{font-stretch:125%;font-weight:800;font-size:28px;letter-spacing:.34em;line-height:1;margin-right:-.34em}
.logo img{max-height:48px;display:block}
.sl{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--g);margin-top:10px}
.meta{text-align:right}
.lab{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--g);font-weight:500;margin-bottom:6px}
.meta .no{font-size:15px;font-weight:600;letter-spacing:.04em}
.meta .dt{color:var(--g);font-size:12px;margin-top:2px}
.pill{display:inline-block;margin-top:10px;border:1px solid #000;border-radius:999px;padding:3px 12px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.pill.p{background:#000;color:#fff}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:28px 0;border-bottom:1px solid var(--l)}
.cols div{font-size:13px;line-height:1.7}
table{width:100%;border-collapse:collapse;margin-top:24px}
th{text-align:left;font-weight:500;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--g);padding:0 8px 12px 0;border-bottom:1px solid var(--l)}
td{padding:16px 8px 16px 0;border-bottom:1px solid var(--l);font-variant-numeric:tabular-nums}
td:first-child{font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.n{text-align:right;white-space:nowrap}
th:last-child,td:last-child{padding-right:0}
.tot{margin:20px 0 0 auto;width:58%}
.tot div{display:flex;justify-content:space-between;padding:5px 0;color:var(--g);font-variant-numeric:tabular-nums}
.tot div span:last-child{color:#000}
.tot .g{border-top:1px solid #000;margin-top:10px;padding-top:14px;color:#000;align-items:baseline}
.tot .g span:first-child{font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
.tot .g span:last-child{font-size:24px;font-weight:300;letter-spacing:-.01em}
.pay{margin-top:32px;padding:20px 22px;background:var(--s);display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.pay .v{font-size:13px;margin-top:2px}
.pay .due{text-align:right}
.pay .due b{display:block;font-size:18px;font-weight:600;margin-top:2px}
.ft{margin-top:40px;padding-top:24px;border-top:1px solid var(--l);text-align:center}
.ft .ty{font-size:10px;letter-spacing:.3em;text-transform:uppercase;font-weight:600}
.ft p{color:var(--g);font-size:11px;margin-top:8px;line-height:1.7}
@media(max-width:560px){body{padding:16px 10px}.r{padding:36px 22px 28px}.logo{font-size:22px}.cols{grid-template-columns:1fr;gap:18px}.tot{width:100%}th:nth-child(4),td:nth-child(4){display:none}.pay{flex-direction:column;align-items:flex-start}.pay .due{text-align:left}}
@page{size:A5;margin:10mm}
@media print{body{background:#fff;padding:0}.r{box-shadow:none;padding:0;max-width:none;animation:none}.bar{display:none}.pay{-webkit-print-color-adjust:exact;print-color-adjust:exact}.pill.p{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(prefers-reduced-motion:reduce){.r{animation:none}}
</style></head><body>
<div class="bar"><button class="pb" onclick="print()">Save as PDF</button><button class="pb d" onclick="print()">Print receipt</button></div>
<div class="r" id="r"></div>
<script>
/* ===== EDIT ===== */
const LOGO="";
const PHONE="+20 115 849 1356";
const NOTE="Exchanges within 14 days with the receipt and unworn items.";
/* ================ */
const q=new URLSearchParams(location.search),g=k=>q.get(k)||"";
const e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=t=>parseFloat(String(t).replace(/[^\d.]/g,""))||0;
const m=n=>Math.round(Number(n)||0).toLocaleString("en")+" EGP";
const PAY={cod:"Cash on delivery",insta:"InstaPay",wallet:"E-wallet"};
const logo=LOGO?`<img src="${e(LOGO)}" alt="EATHER">`:"EATHER";
if(!g("id")){document.getElementById("r").innerHTML="<p>Open this page from the Receipt link in your admin page.</p>"}
else{
const rows=g("lines").split(";").filter(Boolean).map(l=>{const[a,s,n,p]=l.split("|");return`<tr><td>${e(a)}</td><td>${e(s)}</td><td class="n">${e(n)}</td><td class="n">${m(p)}</td><td class="n">${m(p*n)}</td></tr>`}).join("");
const cod=g("pay")=="cod",pm=PAY[g("pay")]||g("pay"),total=m(num(g("total")));
document.title="EATHER Receipt "+g("id");
document.getElementById("r").innerHTML=`
<div class="top"><div><div class="logo">${logo}</div><div class="sl">Silent Chaos.</div></div>
<div class="meta"><span class="lab">Receipt</span><div class="no">${e(g("id"))}</div><div class="dt">${e(g("date")||new Date().toLocaleDateString("en-GB"))}</div><span class="pill ${cod?"":"p"}">${cod?"Due on delivery":"Paid"}</span></div></div>
<div class="cols"><div><span class="lab">Customer</span>${e(g("name"))}<br>${e(g("phone"))}</div>
<div><span class="lab">Ship to</span>${e(g("addr"))}<br>${e(g("city"))}${g("zone")?" · "+e(g("zone")):""}</div></div>
<table><tr><th>Item</th><th>Size</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Total</th></tr>${rows}</table>
<div class="tot"><div><span>Subtotal</span><span>${m(g("sub")||0)}</span></div>${(()=>{const d=Math.round(num(g("disc")||g("discount"))||(num(g("sub"))+num(g("ship"))-num(g("total"))));const c=g("code")||g("promo");return d>0?`<div><span>Discount${c?" ("+e(c)+")":""}</span><span>− ${m(d)}</span></div>`:""})()}<div><span>Shipping</span><span>${m(g("ship")||0)}</span></div><div class="g"><span>Total</span><span>${total}</span></div></div>
<div class="pay"><div><span class="lab">Payment</span><div class="v">${e(pm)}${g("ref")?" · Ref "+e(g("ref")):""}</div></div><div class="due"><span class="lab">${cod?"Amount due":"Status"}</span><b>${cod?total:"Paid"}</b></div></div>
<div class="ft"><div class="ty">Thank you for choosing EATHER</div><p>${e(NOTE)}<br>WhatsApp ${e(PHONE)}</p></div>`}
</script></body></html>
