<div class="top"><span class="logo">EATHER</span><small>Orders</small><span class="sp"></span><button class="btn o" id="rf">Refresh</button><button class="btn o" id="lo">Log out</button></div>
<main id="m"></main>
<script>
const $=s=>document.querySelector(s),ST=["New","Paid","Shipped","Delivered","Cancelled"],COL={New:"#000000",Paid:"#2e7d32",Shipped:"#1565c0",Delivered:"#9a9a9a",Cancelled:"#c62828"};
let TOK=localStorage.getItem("ae_tok")||"",O=[],F="All",Q="";
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=t=>parseFloat(String(t).replace(/[^\d.]/g,""))||0;
const wa=p=>{p=String(p).replace(/\D/g,"");return"https://wa.me/"+(p.startsWith("0")?"2"+p:p)};
const PAY={cod:"Cash on delivery",insta:"InstaPay",wallet:"E-wallet"};
function login(err){$("#m").innerHTML=`<div class="login"><h2 style="font-stretch:75%;font-weight:800;font-size:28px;margin-bottom:14px">Sign in</h2><label>Password</label><input id="t" type="password"><button class="btn" id="go" style="width:100%">Open dashboard</button><p class="err" id="er">${e(err||"")}</p></div>`;
$("#go").onclick=()=>{TOK=$("#t").value;load()}}
async function load(){$("#m").innerHTML='<p id="msg">Loading…</p>';
try{const j=await(await fetch("api/orders?token="+encodeURIComponent(TOK))).json();if(j.error)throw 0;O=j.orders.reverse();localStorage.setItem("ae_tok",TOK);draw()}
catch(x){localStorage.removeItem("ae_tok");TOK="";login("Session expired or orders could not load. Sign in again.")}}
function draw(){const c=s=>O.filter(o=>o.status==s).length,rev=O.filter(o=>o.status!="Cancelled").reduce((a,o)=>a+num(o.total),0);
const L=O.filter(o=>(F=="All"||o.status==F)&&(o.name+o.id+o.phone+o.city).toLowerCase().includes(Q));
$("#m").innerHTML=`<div class="stats"><div class="st"><span>New</span><b>${c("New")}</b></div><div class="st"><span>To ship (paid)</span><b>${c("Paid")}</b></div><div class="st"><span>Shipped</span><b>${c("Shipped")}</b></div><div class="st"><span>Revenue</span><b>${Math.round(rev).toLocaleString()}</b> EGP</div></div>
<div class="bar">${["All",...ST].map(s=>`<button data-f="${s}" class="${s==F?"on":""}">${s}</button>`).join("")}<input id="q" placeholder="Search name, order ID, phone, city" value="${e(Q)}"></div>
${L.map(o=>`<div class="ord"><div><b>${e(o.name)}</b><small>${e(o.id||"No ID")}</small><small>${new Date(o.date).toLocaleString("en-GB",{timeZone:"Africa/Cairo",dateStyle:"medium",timeStyle:"short"})}</small></div>
<div>${e(o.items)}<small>${e(o.city)} · ${e(o.address)}</small><small>${e(PAY[o.pay]||o.pay)}${o.ref?" · Ref "+e(o.ref):""} · ${e(o.phone)}</small></div>
<div><div class="tot">${e(o.total)}</div><select data-r="${o.row}">${ST.map(s=>`<option ${s==o.status?"selected":""}>${s}</option>`).join("")}</select><div class="acts">${o.receipt?`<a class="btn o" target="_blank" href="${e(o.receipt)}">Receipt</a>`:""}<a class="btn o" target="_blank" href="${wa(o.phone)}">WhatsApp</a>${/Code \S+ \(/.test(o.items)?`<button class="btn o" data-al="${o.row}" style="flex:1;font-size:13px;padding:6px 10px">Allow code again</button>`:""}</div></div></div>`).join("")||"<p>No orders here.</p>"}`;
$("#q").oninput=x=>{Q=x.target.value.toLowerCase();const p=x.target.selectionStart;draw();$("#q").focus();$("#q").setSelectionRange(p,p)};
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{F=b.dataset.f;draw()});
document.querySelectorAll("[data-r]").forEach(s=>s.onchange=async()=>{const o=O.find(x=>x.row==s.dataset.r);o.status=s.value;draw();
await fetch("api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"status",token:TOK,row:o.row,id:o.id,status:o.status})})})}
document.addEventListener("click",async ev=>{const b=ev.target.closest("[data-al]");if(!b)return;
const o=O.find(x=>x.row==b.dataset.al),m=String(o.items).match(/Code (\S+) \(/);if(!m)return;
if(!confirm("Let "+o.name+" use "+m[1]+" one more time?"))return;
const r=await fetch("api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"allow",token:TOK,code:m[1],phone:o.phone,email:o.email})});
alert(r.ok?"Done. This customer can use "+m[1]+" once more.":"Could not save. Try again.")});
$("#rf").onclick=()=>TOK?load():login();
$("#lo").onclick=()=>{localStorage.removeItem("ae_tok");TOK="";login()};
TOK?load():login();
</script>
<script id="admin-charts-js">
(function(){
const day=d=>new Date(d).toLocaleDateString("en-CA",{timeZone:"Africa/Cairo"});
const fmt=n=>Math.round(n).toLocaleString();
const T=["#000","#555","#999","#C8C8C8","#E5E5E5"];
const share=r=>{const s=r.reduce((a,x)=>a+x[1],0)||1;return r.length?r.map(x=>{const p=Math.round(x[1]/s*100);return`<div class="hb"><div>${e(x[0])}<span>${p}%</span></div><i style="--w:${p}%"></i></div>`}).join(""):'<p class="ax">No data yet</p>'};
const top=f=>{const c={};O.forEach(o=>f(o).forEach(([k,v])=>{if(k)c[k]=(c[k]||0)+v}));return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4)};
function clear(){const a=document.getElementById("an");if(a)a.remove();document.body.classList.remove("has-an")}
function charts(){
clear();
const s=document.querySelector(".stats");if(!s||!O.length)return;
const ok=O.filter(o=>o.status!="Cancelled"),rev=ok.reduce((a,o)=>a+num(o.total),0),tot=O.length;
const N=30,days=[];for(let i=N-1;i>=0;i--)days.push(day(Date.now()-i*864e5));
const cnt=days.map(d=>O.filter(o=>day(o.date)==d).length),mx=Math.max(1,...cnt);
const lab=d=>new Date(d+"T12:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const st=ST.map(x=>[x,O.filter(o=>o.status==x).length]).filter(r=>r[1]);
let a=0;const grad=st.map((r,i)=>{const b=a+r[1]/tot*360,g=`${T[i]} ${a}deg ${b}deg`;a=b;return g}).join(",");
const prod=top(o=>String(o.items).split(/,|\n|\+/).map(t=>[t.replace(/Code \S+ \(.*?\)/,"").split("/")[0].trim(),1]));
const city=top(o=>[[String(o.city||"").trim(),1]]);
const pay=top(o=>[[PAY[o.pay]||o.pay,1]]);
const side=innerWidth>=1280;
const html=`<aside id="an" class="${side?"side":""}">
<div class="cc"><h3>Revenue · 30 days</h3><div class="big">${fmt(rev)}<small>EGP · ${tot} orders</small></div>
<div class="cols">${cnt.map((v,i)=>`<i class="${v?"v":""}" style="height:${v?Math.max(10,v/mx*100):2}%" title="${lab(days[i])}: ${v}"></i>`).join("")}</div>
<div class="ax"><span>${lab(days[0])}</span><span>Today</span></div></div>
<div class="cc"><h3>Average order</h3><div class="big" style="margin:0">${fmt(ok.length?rev/ok.length:0)}<small>EGP</small></div></div>
<div class="cc"><h3>Order status</h3><div class="dn"><div class="ring" style="background:conic-gradient(${grad})"></div><div class="lg">${st.map((r,i)=>`<div><b style="background:${T[i]}"></b>${r[0]}<span>${r[1]}</span></div>`).join("")}</div></div></div>
<div class="cc"><h3>Top products</h3>${share(prod)}</div>
<div class="cc"><h3>Top cities</h3>${share(city)}</div>
<div class="cc"><h3>Payment</h3>${share(pay)}</div></aside>`;
if(side){document.body.insertAdjacentHTML("beforeend",html);document.body.classList.add("has-an")}else s.insertAdjacentHTML("afterend",html);
}
const d0=draw;draw=function(){d0();charts()};
const l0=login;login=function(x){clear();l0(x)};
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(charts,200)});
charts();
})();
</script>

<script id="admin-print-js">
(function(){
const PHONE="+20 115 849 1356",NOTE="Exchanges within 14 days with the receipt and unworn items.";
const m=n=>Math.round(Number(n)||0).toLocaleString("en")+" EGP";
function one(o){
let q;try{q=new URL(o.receipt,location.href).searchParams}catch(x){q=new URLSearchParams()}
const g=k=>q.get(k)||"";
const pay=g("pay")||o.pay,cod=pay=="cod",pm=PAY[pay]||pay;
let rows=g("lines").split(";").filter(Boolean).map(l=>{const[a,s,n,p]=l.split("|");return`<tr><td>${e(a)}</td><td>${e(s)}</td><td class="n">${e(n)}</td><td class="n">${m(p)}</td><td class="n">${m(p*n)}</td></tr>`}).join("");
if(!rows)rows=`<tr><td colspan="5">${e(o.items)}</td></tr>`;
const total=m(num(g("total")||o.total)),sub=num(g("sub")),ship=num(g("ship"));
const dsc=Math.round(num(g("disc")||g("discount"))||(sub?sub+ship-num(g("total")||o.total):0)),code=g("code")||g("promo")||((String(o.items).match(/Code (\S+) \(/)||[])[1]||"");
const dt=g("date")||new Date(o.date).toLocaleString("en-GB",{timeZone:"Africa/Cairo",dateStyle:"short",timeStyle:"short"}).replace(",","");
return`<div class="rc">
<div class="top"><div><div class="logo">EATHER</div><div class="sl">Silent Chaos.</div></div>
<div class="meta"><span class="lab">Receipt</span><div class="no">${e(g("id")||o.id)}</div><div class="dt">${e(dt)}</div><span class="pill ${cod?"":"p"}">${cod?"Due on delivery":"Paid"}</span></div></div>
